services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ink_house}
      POSTGRES_USER: ${POSTGRES_USER:-ink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ink_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ink} -d ${POSTGRES_DB:-ink_house}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
